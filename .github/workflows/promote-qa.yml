name: Promote exact main commit to QA

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact 40-character commit SHA already merged into main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: qa-promotion
  cancel-in-progress: false

jobs:
  verify-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Mint a scoped QA promotion token
        id: qa-promotion-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.QA_PROMOTION_CLIENT_ID }}
          private-key: ${{ secrets.QA_PROMOTION_PRIVATE_KEY }}
          permission-contents: write

      - name: Check out main with complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ steps.qa-promotion-app.outputs.token }}
          persist-credentials: true

      - name: Validate requested promotion
        env:
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          printf '%s' "$RELEASE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          git fetch origin main qa
          git cat-file -e "$RELEASE_SHA^{commit}"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          git merge-base --is-ancestor origin/qa "$RELEASE_SHA"

      - name: Check out the exact release commit
        env:
          RELEASE_SHA: ${{ inputs.sha }}
        run: git checkout --detach "$RELEASE_SHA"

      - name: Set up Node.js for contracts and Web
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.19
          cache: npm

      - name: Verify Clarity contracts
        run: |
          npm ci
          npm test
          npm run security:gate

      - name: Install Web dependencies
        working-directory: App
        run: npm ci

      - name: Verify isolated QA Web build
        working-directory: App
        env:
          NEXT_PUBLIC_STACKS_NETWORK: testnet
          NEXT_PUBLIC_CONTRACT_ADDRESS: ST16EWRC01S1SFWGBP63MW47VY8P3AYFA8VGEBGE5
          NEXT_PUBLIC_STX_COMMERCE_CONTRACT: agentic-commerce-v5
          NEXT_PUBLIC_SBTC_COMMERCE_CONTRACT: sbtc-commerce-v4
          NEXT_PUBLIC_REPUTATION_CONTRACT: reputation-registry-v3
          NEXT_PUBLIC_SITE_URL: https://qa.nayori.ai
          NEXT_PUBLIC_RELEASE_CHANNEL: qa
          NEXT_PUBLIC_NAYORI_EVALUATOR_ADDRESS: ST16EWRC01S1SFWGBP63MW47VY8P3AYFA8VGEBGE5
          NEXT_PUBLIC_NAYORI_APPEAL_AUTHORITY_ADDRESS: ST2K7PV5NXBNRV510S6DCA6RFMTFHAF3ZPJG0N53H
          NEXT_PUBLIC_NAYORI_API_ORIGIN: https://api.qa.nayori.ai
          NEXT_PUBLIC_NAYORI_FACILITATOR_ORIGIN: https://facilitator.qa.nayori.ai
          NEXT_PUBLIC_NAYORI_OAUTH_ORIGIN: https://oauth.qa.nayori.ai
        run: |
          npm test
          npm run lint
          npm run build

      - name: Verify production defaults remain on v4 and v3
        working-directory: App
        env:
          NEXT_PUBLIC_STACKS_NETWORK: mainnet
          NEXT_PUBLIC_CONTRACT_ADDRESS: SP2K7PV5NXBNRV510S6DCA6RFMTFHAF3ZPK6ZSXPH
          NEXT_PUBLIC_STX_COMMERCE_CONTRACT: agentic-commerce-v4
          NEXT_PUBLIC_SBTC_COMMERCE_CONTRACT: sbtc-commerce-v3
          NEXT_PUBLIC_REPUTATION_CONTRACT: reputation-registry-v3
          NEXT_PUBLIC_SITE_URL: https://nayori.ai
        run: npm run build

      - name: Set up Node.js for developer portal
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: developer-portal/package-lock.json

      - name: Verify developer portal
        working-directory: developer-portal
        run: |
          npm ci
          npm run verify
          npm audit --audit-level=high

      - name: Promote the verified SHA without force
        env:
          RELEASE_SHA: ${{ inputs.sha }}
        run: git push origin "$RELEASE_SHA:refs/heads/qa"
