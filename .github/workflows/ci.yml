name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - qa

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Clarity contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.19
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run security:gate

  app:
    name: ${{ matrix.checkName }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - checkName: Frontend legacy v5/v4 compatibility
            channel: qa
            site: https://qa.nayori.ai
            network: testnet
            deployer: ST16EWRC01S1SFWGBP63MW47VY8P3AYFA8VGEBGE5
            profile: legacy-v5-v4-read
            stx: agentic-commerce-v5
            sbtc: sbtc-commerce-v4
            evaluator: STBTXHXFXFGMNPXST7A6XQ1WNGC0V6TB6CDDQZB4
            managedEvaluator: "true"
            authority: ST256E5DAXM7RDFZ76ECCTPTBYHRXXJQ29H16DN69
            apiOrigin: https://api.qa.nayori.ai
            facilitatorOrigin: https://facilitator.qa.nayori.ai
            oauthOrigin: https://oauth.qa.nayori.ai
          - checkName: Frontend QA testnet v6/v5
            channel: qa
            site: https://qa.nayori.ai
            network: testnet
            deployer: ST16EWRC01S1SFWGBP63MW47VY8P3AYFA8VGEBGE5
            profile: current-v6-v5
            stx: agentic-commerce-v6
            sbtc: sbtc-commerce-v5
            evaluator: STBTXHXFXFGMNPXST7A6XQ1WNGC0V6TB6CDDQZB4
            managedEvaluator: "true"
            authority: ST256E5DAXM7RDFZ76ECCTPTBYHRXXJQ29H16DN69
            apiOrigin: https://api.qa.nayori.ai
            facilitatorOrigin: https://facilitator.qa.nayori.ai
            oauthOrigin: https://oauth.qa.nayori.ai
          - checkName: Frontend production mainnet v6/v5
            channel: production
            site: https://nayori.ai
            network: mainnet
            deployer: SP2K7PV5NXBNRV510S6DCA6RFMTFHAF3ZPK6ZSXPH
            profile: current-v6-v5
            stx: agentic-commerce-v6
            sbtc: sbtc-commerce-v5
            evaluator: SP3GRG5CKEFNYM5BV0NPPHCM51FT176JQ02QWQ9T3
            managedEvaluator: "false"
            authority: SP2R584GC8W2A921080TY8CQ8P1GZ6JNXYXS65DA6
            apiOrigin: https://api.nayori.ai
            facilitatorOrigin: https://facilitator.nayori.ai
            oauthOrigin: https://oauth.nayori.ai
    defaults:
      run:
        working-directory: App
    # Disposable Postgres for the participant-registry integration test; discarded with the job.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: nayori
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_PUBLIC_RELEASE_CHANNEL: ${{ matrix.channel }}
      NEXT_PUBLIC_SITE_URL: ${{ matrix.site }}
      NEXT_PUBLIC_STACKS_NETWORK: ${{ matrix.network }}
      NEXT_PUBLIC_CONTRACT_ADDRESS: ${{ matrix.deployer }}
      NEXT_PUBLIC_CONTRACT_PROFILE: ${{ matrix.profile }}
      NEXT_PUBLIC_STX_COMMERCE_CONTRACT: ${{ matrix.stx }}
      NEXT_PUBLIC_SBTC_COMMERCE_CONTRACT: ${{ matrix.sbtc }}
      NEXT_PUBLIC_REPUTATION_CONTRACT: reputation-registry-v3
      NEXT_PUBLIC_NAYORI_EVALUATOR_ADDRESS: ${{ matrix.evaluator }}
      NEXT_PUBLIC_NAYORI_MANAGED_EVALUATOR_ENABLED: ${{ matrix.managedEvaluator }}
      NEXT_PUBLIC_NAYORI_APPEAL_AUTHORITY_ADDRESS: ${{ matrix.authority }}
      NEXT_PUBLIC_NAYORI_API_ORIGIN: ${{ matrix.apiOrigin }}
      NEXT_PUBLIC_NAYORI_FACILITATOR_ORIGIN: ${{ matrix.facilitatorOrigin }}
      NEXT_PUBLIC_NAYORI_OAUTH_ORIGIN: ${{ matrix.oauthOrigin }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.19
          cache: npm
          cache-dependency-path: App/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      # Unit tests exercise profile switching explicitly. Keep their process-level baseline on
      # the writable current generation; the build below still uses every exact matrix profile.
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/nayori
          NEXT_PUBLIC_CONTRACT_PROFILE: current-v6-v5
          NEXT_PUBLIC_STX_COMMERCE_CONTRACT: agentic-commerce-v6
          NEXT_PUBLIC_SBTC_COMMERCE_CONTRACT: sbtc-commerce-v5
      - run: npm run lint
      - run: npm run build
      - run: npm run check:bundle

  developer-portal:
    name: Developer portal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: developer-portal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: developer-portal/package-lock.json
      - run: npm ci
      - run: npm run verify
      - run: npm audit --audit-level=high
