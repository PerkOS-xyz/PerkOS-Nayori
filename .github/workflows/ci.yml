name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Clarity contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19
          cache: npm
      - run: npm ci
      - run: npm test

  app:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: App
    env:
      NEXT_PUBLIC_STACKS_NETWORK: testnet
      NEXT_PUBLIC_CONTRACT_ADDRESS: ST16EWRC01S1SFWGBP63MW47VY8P3AYFA8VGEBGE5
      NEXT_PUBLIC_STX_COMMERCE_CONTRACT: agentic-commerce-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19
          cache: npm
          cache-dependency-path: App/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  developer-portal:
    name: Developer portal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: developer-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: npm
          cache-dependency-path: developer-portal/package-lock.json
      - run: npm ci
      - run: npm run verify
      - run: npm audit --audit-level=high
